[notification]
filter_order = [ "filter" ]

    [notification.filter.filter]
    allow_permanent = false
    allowed_urgencies = [ "low" ]
    bypass_dnd = false
    enabled = true
    match = "cs2"
    play_sound = false
    save_history = false
    show_toast = false

[osd.kinds]
caffeine = false
keyboard_backlight = false
lock_keys = false
nightlight = false
power_profile = false

[plugins]
enabled = [ "yuuto/arch-updater", "alexander/screen-toolkit", "noctalia/screen_recorder" ]

[shell]
app_icon_color = "tertiary"
app_icon_colorize = true
avatar_path = "/home/saber/Pictures/Icons/luffy.jpeg"
corner_radius_scale = 2.0
font_family = "MonaspiceNe Nerd Font Mono"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
show_location = false

    [shell.animation]
    speed = 1.8500000275671482

    [shell.greeter_sync]
    auto_sync = true
    privilege_command = "ghostty -e pkexec"

    [shell.launcher]
    pinned = [ "steam" ]

    [shell.panel]
    session_position = "center"

    [shell.screen_corners]
    enabled = true
    size = 26

[theme]
builtin = "Noctalia"
community_palette = "Monochrome"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "fastfetch" ]

[wallpaper.default]
path = "/home/saber/Pictures/Wallpapers/berserk.jpg"

[wallpaper.last]
path = "/home/saber/Pictures/Wallpapers/berserk.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/saber/Pictures/Wallpapers/berserk.jpg"

[widget.clock]
format = "{:%I:%M}"

[widget.media]
hide_when_no_media = true

[widget.recorder]
capsule = true
type = "noctalia/screen_recorder:recorder"

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.widget_2]
capsule = true
type = "alexander/screen-toolkit:widget"